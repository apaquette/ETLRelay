[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowforge"
version = "0.1.0"
description = "A lightweight, composable framework for building declarative ETL pipelines in Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alex Paquette" }
]
dependencies = [
    "pyarrow>=21,<22",
    "polars>=1.0,<2",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "typer>=0.16,<1"
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "pyright>=1.1,<2",
    "ruff>=0.13,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"