name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      distribution: ${{ steps.metadata.outputs.distribution }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the dev branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "dev" ]]; then
            echo "TestPyPI publishing must be run from the dev branch; selected: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          distribution = re.sub(r"[-_.]+", "-", project["name"]).lower()
          if distribution != "etlrelay":
              raise SystemExit(f"Expected distribution name 'etlrelay', got {project['name']!r}")
          print(f"version={project['version']}")
          print(f"distribution={distribution}")
          PY

      - name: Install locked project and development dependencies
        run: uv sync --locked --all-groups

      - name: Run tests with branch coverage
        run: >-
          uv run pytest
          --cov=etlrelay
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90.1

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run pyright

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build source distribution and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx --from 'twine>=6,<7' twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testpypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/etlrelay/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testpypi-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    name: install and smoke-test TestPyPI package
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for runtime dependency metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Export runtime dependencies without the checkout package
        run: >-
          uv export
          --no-dev
          --no-default-groups
          --no-emit-project
          --format requirements.txt
          --output-file /tmp/etlrelay-runtime-requirements.txt

      - name: Create a clean environment and install runtime dependencies
        run: |
          uv venv --python 3.12 /tmp/etlrelay-smoke
          uv pip install --python /tmp/etlrelay-smoke/bin/python \
            -r /tmp/etlrelay-runtime-requirements.txt

      - name: Wait for TestPyPI to index the release
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent \
              "https://test.pypi.org/pypi/etlrelay/${PACKAGE_VERSION}/json" \
              >/dev/null; then
              echo "TestPyPI has indexed etlrelay ${PACKAGE_VERSION}."
              exit 0
            fi
            echo "Waiting for TestPyPI indexing (attempt ${attempt}/24)..."
            sleep 5
          done
          echo "TestPyPI did not index etlrelay ${PACKAGE_VERSION} within two minutes." >&2
          exit 1

      - name: Install the published TestPyPI distribution
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          uv pip install
          --python /tmp/etlrelay-smoke/bin/python
          --index-url https://test.pypi.org/simple/
          --no-deps
          "etlrelay==${PACKAGE_VERSION}"

      - name: Smoke-test installed package outside the repository
        run: |
          cd /tmp
          /tmp/etlrelay-smoke/bin/python -c \
            "from etlrelay.core.batch import Batch; from etlrelay.pipeline.pipeline import Pipeline; print('ETLRelay installed-package imports succeeded')"
