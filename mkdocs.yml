site_name: ETLRelay
site_description: A lightweight, composable Python framework for batch-oriented ETL pipelines.
docs_dir: docs
site_url: "https://apaquette.github.io/ETLRelay/"
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli-reference.md
  - Concepts: concepts.md
  - YAML Configuration: configuration.md
  - Security: security.md
  - API Reference: api-reference.md
  - Development:
      - Overview: development.md
      - Release automation: development/release-automation.md
  - Roadmap: roadmap.md
  - Architecture:
      - Overview: architecture/overview.md
      - Pipeline: architecture/pipeline.md
      - Configuration:
          - Loading: architecture/configuration-loading.md
          - Validation: architecture/configuration-validation.md
          - Component registry: architecture/component-registry.md
          - Data representation contracts: architecture/data-representation-contracts.md
      - Processors:
          - Column selection and renaming: architecture/select_columns_and_rename_columns.md
          - Row filtering: architecture/filter_rows_processor.md
      - File source: architecture/file_source.md
      - File sink: architecture/file_sink.md
      - SQL source and sink: architecture/sql_source_and_sink.md
      - Local filesystem: architecture/local_filesystem.md
      - Path validator: architecture/path_validator.md
      - Reader and writer: architecture/reader_and_writer.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mike:
      alias_type: redirect
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

watch:
  - src/etlrelay

extra:
  version:
    provider: mike
    default: latest
